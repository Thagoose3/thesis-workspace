<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="6" stroke-opacity="0.35"/>

  <!-- Ambient Glow Behind Paper -->
  <circle cx="256" cy="256" r="140" fill="#3b82f6" opacity="0.18" filter="url(#glow)"/>

  <!-- Document Body -->
  <g filter="url(#glow)">
    <!-- Base Paper -->
    <path d="M148 116 C148 102.7 158.7 92 172 92 L308 92 L364 148 L364 396 C364 409.3 353.3 420 340 420 L172 420 C158.7 420 148 409.3 148 396 Z" fill="url(#docGrad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.5"/>
    
    <!-- Folded Corner Flap -->
    <path d="M308 92 L308 140 C308 144.4 311.6 148 316 148 L364 148 Z" fill="#93c5fd"/>
    
    <!-- Document Content Lines -->
    <!-- Title Bar -->
    <rect x="184" y="156" width="100" height="20" rx="8" fill="url(#blueGlow)"/>
    
    <!-- Text Lines -->
    <rect x="184" y="200" width="144" height="12" rx="6" fill="#94a3b8" opacity="0.6"/>
    <rect x="184" y="232" width="144" height="12" rx="6" fill="#94a3b8" opacity="0.6"/>
    <rect x="184" y="264" width="120" height="12" rx="6" fill="#94a3b8" opacity="0.6"/>
    <rect x="184" y="296" width="144" height="12" rx="6" fill="#94a3b8" opacity="0.6"/>
    <rect x="184" y="328" width="88" height="12" rx="6" fill="#94a3b8" opacity="0.6"/>

    <!-- Vault Badge / Golden Gem on bottom right of paper -->
    <circle cx="316" cy="356" r="28" fill="#09090b" stroke="#3b82f6" stroke-width="4"/>
    <path d="M316 342 L324 350 L320 366 L312 366 L308 350 Z" fill="url(#blueGlow)"/>
  </g>
</svg>
