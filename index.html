<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThesisMind</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            zinc: {
              850: '#141417',
              900: '#121215',
              950: '#09090b',
            }
          }
        }
      }
    }
  </script>

  <!-- PDF.js Library CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <!-- Marked.js Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Custom Styles & PWA Manifest -->
  <link rel="stylesheet" href="./css/app.css">
  <link rel="manifest" href="./manifest.json">
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen w-screen flex flex-col select-none overflow-hidden antialiased">

  <!-- ================= MINIMALIST TOP NAV ================= -->
  <header class="h-12 bg-zinc-900/90 border-b border-white/[0.06] px-3 flex items-center justify-between flex-shrink-0 z-30 backdrop-blur-xl">
    
    <!-- Left: Sidebar Toggle & App Title -->
    <div class="flex items-center space-x-2">
      <button id="btn-toggle-left-panel" class="p-1.5 rounded-lg text-zinc-400 hover:text-zinc-100 hover:bg-white/[0.06] transition" title="Toggle Sidebar">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 6h16M4 12h16M4 18h7"/></svg>
      </button>

      <div class="flex items-center space-x-1.5">
        <span class="text-xs font-semibold tracking-tight text-zinc-100">ThesisMind</span>
        <span class="text-[10px] text-zinc-500 font-mono hidden sm:inline">/ workspace</span>
      </div>
    </div>

    <!-- Center: Sleek Command Search Bar (Ctrl+K) -->
    <div class="flex-1 max-w-sm mx-3">
      <button id="btn-open-search" class="w-full px-3 py-1.5 rounded-xl bg-zinc-950/70 hover:bg-zinc-950 border border-white/[0.06] hover:border-white/[0.12] text-xs text-zinc-400 flex items-center justify-between transition group shadow-sm">
        <div class="flex items-center space-x-2 truncate">
          <svg class="w-3.5 h-3.5 text-zinc-500 group-hover:text-zinc-300 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <span class="text-zinc-400 text-xs">Search...</span>
        </div>
        <kbd class="px-1.5 py-0.5 rounded bg-zinc-850 text-zinc-400 font-mono text-[9px] border border-white/[0.08]">Ctrl K</kbd>
      </button>
    </div>

    <!-- Right: Reading Mode Pills & Tools -->
    <div class="flex items-center space-x-2">
      <!-- Theme Switcher -->
      <div class="flex items-center bg-zinc-950/80 p-0.5 rounded-lg border border-white/[0.06] text-xs">
        <button id="btn-theme-normal" class="px-2 py-1 rounded-md text-[11px] font-medium bg-blue-600 text-white transition" title="Light Paper">
          <span>Light</span>
        </button>
        <button id="btn-theme-sepia" class="px-2 py-1 rounded-md text-[11px] font-medium text-amber-300/80 hover:text-amber-200 transition" title="Warm Sepia">
          <span>Sepia</span>
        </button>
        <button id="btn-theme-dark" class="px-2 py-1 rounded-md text-[11px] font-medium text-zinc-400 hover:text-zinc-200 transition" title="Dark Contrast">
          <span>Dark</span>
        </button>
      </div>

      <!-- Summary Matrix Button -->
      <button id="btn-header-matrix" class="px-2.5 py-1 rounded-lg bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.08] text-zinc-300 hover:text-white text-xs font-medium flex items-center space-x-1.5 transition" title="Literature Review Matrix">
        <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <span class="hidden md:inline text-[11px]">Matrix</span>
      </button>

      <!-- Toggle Right Panel -->
      <button id="btn-toggle-right-panel" class="p-1.5 rounded-lg text-zinc-400 hover:text-zinc-100 hover:bg-white/[0.06] transition" title="Toggle Notes Studio">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </header>

  <!-- ================= FLOATING TTS AUDIO CONTROLLER ================= -->
  <div id="tts-player-bar" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-40 minimal-dropdown rounded-full shadow-2xl px-3.5 py-1.5 flex items-center space-x-2.5 border border-white/[0.1]">
    <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
      <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    </div>
    <div class="max-w-xs min-w-[160px] truncate">
      <p id="tts-text-preview" class="text-[11px] text-zinc-300 truncate italic">Reading text...</p>
    </div>
    <div class="flex items-center space-x-1 border-l border-white/[0.1] pl-2">
      <button id="btn-tts-playpause" class="p-1 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white transition">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button id="btn-tts-stop" class="p-1 rounded-full bg-zinc-800 hover:bg-zinc-700 text-zinc-400 transition">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
      </button>
      <select id="tts-rate-select" class="bg-zinc-900 text-[10px] text-zinc-300 rounded px-1.5 py-0.5 border border-white/[0.08] focus:outline-none">
        <option value="0.75">0.75x</option>
        <option value="1.0" selected>1.0x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
      </select>
    </div>
  </div>

  <!-- ================= 3-COLUMN WORKSPACE ================= -->
  <main class="flex-1 flex overflow-hidden relative">

    <!-- Column 1: Explorer Sidebar (Left) -->
    <aside id="explorer-col" class="w-64 min-w-[200px] max-w-[420px] h-full flex-shrink-0 flex flex-col transition-all duration-150">
      <div id="explorer-container" class="h-full"></div>
    </aside>

    <!-- Left Resizer Bar -->
    <div id="resizer-left" class="resizer-h"></div>

    <!-- Column 2: Minimal PDF Reading Studio (Center) -->
    <section id="reader-col" class="flex-1 h-full flex flex-col bg-zinc-950 overflow-hidden min-w-[300px] relative">
      
      <!-- Minimalist Floating Top Toolbar for PDF -->
      <div id="pdf-toolbar" class="h-10 bg-zinc-900/70 border-b border-white/[0.04] px-4 flex items-center justify-between flex-shrink-0 text-xs text-zinc-300 backdrop-blur-md">
        <!-- Document Title -->
        <div class="flex items-center space-x-2 truncate max-w-sm">
          <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
          <span id="current-file-title" class="text-xs font-medium text-zinc-200 truncate">No Document Selected</span>
          <button id="btn-close-current-file" class="hidden p-0.5 rounded-md hover:bg-white/[0.08] text-zinc-500 hover:text-zinc-200 transition" title="Close Document (ปิดหน้าอ่านเปเปอร์นี้)">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>

        <!-- Controls: Page & Zoom Pills -->
        <div class="flex items-center space-x-2">
          <!-- Page Navigation -->
          <div class="flex items-center space-x-1 bg-zinc-950/80 px-2 py-0.5 rounded-lg border border-white/[0.06]">
            <button id="btn-page-prev" class="p-0.5 rounded text-zinc-400 hover:text-zinc-100 transition" title="Previous Page">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <span class="text-[10px] font-mono text-zinc-500">p.</span>
            <input type="number" id="page-input" min="1" value="1" class="w-7 px-0.5 py-0.5 bg-transparent text-center text-[11px] font-mono rounded border-none text-zinc-200 focus:outline-none" />
            <span id="page-indicator" class="text-[11px] font-mono text-zinc-500">/ 1</span>
            <button id="btn-page-next" class="p-0.5 rounded text-zinc-400 hover:text-zinc-100 transition" title="Next Page">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>

          <!-- Zoom Navigation -->
          <div class="flex items-center space-x-0.5 bg-zinc-950/80 px-1 py-0.5 rounded-lg border border-white/[0.06]">
            <button id="btn-zoom-out" class="p-1 rounded text-zinc-400 hover:text-zinc-100 transition" title="Zoom Out">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg>
            </button>
            <button id="btn-zoom-fit" class="px-1.5 py-0.5 rounded text-zinc-400 hover:text-zinc-100 text-[10px] font-mono transition" title="Fit Width">fit</button>
            <button id="btn-zoom-in" class="p-1 rounded text-zinc-400 hover:text-zinc-100 transition" title="Zoom In">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- PDF Canvas Viewport Container -->
      <div id="pdf-canvas-container" class="flex-1 overflow-auto p-8 flex flex-col items-center bg-zinc-950 select-text">
        <div class="flex flex-col items-center justify-center h-full text-zinc-600 space-y-2">
          <p class="text-xs text-zinc-500 font-medium">Select a thesis paper from the left panel to begin reading</p>
        </div>
      </div>
    </section>

    <!-- Right Resizer Bar -->
    <div id="resizer-right" class="resizer-h"></div>

    <!-- Column 3: Annotation Studio, Notes & Citations (Right) -->
    <aside id="studio-col" class="w-80 min-w-[280px] max-w-[500px] h-full flex-shrink-0 flex flex-col transition-all duration-150">
      <div id="annotation-studio-container" class="h-full"></div>
    </aside>

  </main>

  <!-- ================= MODALS ================= -->
  <div id="matrix-modal-container" class="hidden"></div>
  <div id="search-modal-container" class="hidden"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- App Script -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
