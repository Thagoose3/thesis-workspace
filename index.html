<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThesisMind - Thesis Reading & Research Workspace</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- PDF.js Library CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <!-- Marked.js Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="./css/app.css">
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen flex flex-col select-none overflow-hidden antialiased">

  <!-- ================= TOP MODERN APP HEADER ================= -->
  <header class="h-14 bg-slate-900/95 border-b border-slate-800/80 px-3.5 flex items-center justify-between flex-shrink-0 z-30 backdrop-blur-xl">
    
    <!-- Left: Brand + Toggle Sidebars -->
    <div class="flex items-center space-x-2.5">
      <button id="btn-toggle-left-panel" class="p-2 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-800 transition" title="Toggle File Explorer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
      </button>

      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        </div>
        <div class="hidden sm:block">
          <h1 class="text-sm font-bold tracking-tight text-white leading-none">ThesisMind</h1>
          <p class="text-[10px] text-slate-400 font-mono mt-0.5">Research & Literature Review Studio</p>
        </div>
      </div>
    </div>

    <!-- Center: Global Deep Search Button (Ctrl+K) -->
    <div class="flex-1 max-w-lg mx-4">
      <button id="btn-open-search" class="w-full px-3.5 py-1.5 rounded-xl bg-slate-950/80 hover:bg-slate-950 border border-slate-800 hover:border-slate-700 text-xs text-slate-400 flex items-center justify-between transition shadow-inner">
        <div class="flex items-center space-x-2 truncate">
          <svg class="w-3.5 h-3.5 text-blue-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <span class="truncate">Search papers, highlights, notes, citations...</span>
        </div>
        <kbd class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 font-mono text-[10px] border border-slate-700">Ctrl+K</kbd>
      </button>
    </div>

    <!-- Right: Reading Mode Pills & Main Action Buttons -->
    <div class="flex items-center space-x-2">
      <!-- Theme Switcher -->
      <div class="flex items-center bg-slate-950/80 p-0.5 rounded-xl border border-slate-800 text-xs">
        <button id="btn-theme-normal" class="px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white transition" title="Standard White Paper">
          <span>☀️ Light</span>
        </button>
        <button id="btn-theme-sepia" class="px-2.5 py-1 rounded-lg text-xs font-medium text-amber-300 hover:text-amber-200 transition" title="Sepia Eye-Care Mode">
          <span>📜 Sepia</span>
        </button>
        <button id="btn-theme-dark" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 transition" title="Dark Mode">
          <span>🌙 Dark</span>
        </button>
      </div>

      <!-- Summary Matrix Button -->
      <button id="btn-header-matrix" class="px-3 py-1.5 rounded-xl bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/30 text-indigo-300 text-xs font-medium flex items-center space-x-1.5 transition" title="Literature Review Comparison Table">
        <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <span class="hidden md:inline">Summary Matrix</span>
      </button>

      <!-- Toggle Right Panel -->
      <button id="btn-toggle-right-panel" class="p-2 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-800 transition" title="Toggle Notes & Citation Panel">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </header>

  <!-- ================= FLOATING TTS AUDIO BAR ================= -->
  <div id="tts-player-bar" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-40 glass-dropdown rounded-2xl shadow-2xl px-4 py-2.5 flex items-center space-x-3 border border-slate-700">
    <div class="w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center animate-pulse">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    </div>
    <div class="max-w-xs min-w-[200px] truncate">
      <p id="tts-text-preview" class="text-xs text-slate-200 truncate italic">Reading text...</p>
    </div>
    <div class="flex items-center space-x-1.5 border-l border-slate-700 pl-3">
      <button id="btn-tts-playpause" class="p-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white transition">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button id="btn-tts-stop" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
      </button>
      <select id="tts-rate-select" class="bg-slate-800 text-[11px] text-slate-300 rounded px-1.5 py-1 border border-slate-700 focus:outline-none">
        <option value="0.75">0.75x</option>
        <option value="1.0" selected>1.0x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
      </select>
    </div>
  </div>

  <!-- ================= 3-COLUMN MAIN WORKSPACE ================= -->
  <main class="flex-1 flex overflow-hidden relative">

    <!-- Column 1: Explorer Sidebar (Left) -->
    <aside id="explorer-col" class="w-72 min-w-[220px] max-w-[480px] h-full flex-shrink-0 flex flex-col transition-all duration-200">
      <div id="explorer-container" class="h-full"></div>
    </aside>

    <!-- Left Resizer Bar -->
    <div id="resizer-left" class="resizer-h bg-slate-800/80 hover:bg-blue-500"></div>

    <!-- Column 2: PDF Reading Studio (Center) -->
    <section id="reader-col" class="flex-1 h-full flex flex-col bg-slate-950 overflow-hidden min-w-[320px] relative">
      
      <!-- Minimal Floating PDF Toolbar -->
      <div id="pdf-toolbar" class="h-11 bg-slate-900/90 border-b border-slate-800/80 px-4 flex items-center justify-between flex-shrink-0 text-xs text-slate-300 backdrop-blur-md">
        <!-- Document Title -->
        <div class="flex items-center space-x-2 truncate max-w-md">
          <div class="w-5 h-5 rounded bg-rose-500/20 text-rose-400 flex items-center justify-center flex-shrink-0 text-[10px] font-bold">PDF</div>
          <span id="current-file-title" class="font-semibold text-slate-200 truncate">No Document Selected</span>
        </div>

        <!-- Controls: Pages & Zoom -->
        <div class="flex items-center space-x-2.5">
          <!-- Page Controls -->
          <div class="flex items-center space-x-1 bg-slate-950/80 px-2 py-1 rounded-xl border border-slate-800">
            <button id="btn-page-prev" class="p-0.5 rounded hover:bg-slate-800 text-slate-300 transition" title="Previous Page">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <span class="text-[11px] font-mono text-slate-400">Page</span>
            <input type="number" id="page-input" min="1" value="1" class="w-8 px-1 py-0.5 bg-slate-900 text-center text-[11px] font-mono rounded border border-slate-700 text-slate-200 focus:outline-none" />
            <span id="page-indicator" class="text-[11px] font-mono text-slate-400">/ 1</span>
            <button id="btn-page-next" class="p-0.5 rounded hover:bg-slate-800 text-slate-300 transition" title="Next Page">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>

          <!-- Zoom Controls -->
          <div class="flex items-center space-x-1 bg-slate-950/80 px-1.5 py-1 rounded-xl border border-slate-800">
            <button id="btn-zoom-out" class="p-0.5 rounded hover:bg-slate-800 text-slate-300 transition" title="Zoom Out">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg>
            </button>
            <button id="btn-zoom-fit" class="px-1.5 py-0.5 rounded hover:bg-slate-800 text-slate-300 text-[10px] font-mono transition" title="Fit to Width">Fit</button>
            <button id="btn-zoom-in" class="p-0.5 rounded hover:bg-slate-800 text-slate-300 transition" title="Zoom In">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- PDF Canvas Viewport Container -->
      <div id="pdf-canvas-container" class="flex-1 overflow-auto p-6 flex flex-col items-center bg-slate-950/70 select-text">
        <div class="flex flex-col items-center justify-center h-full text-slate-500 space-y-3">
          <div class="w-16 h-16 rounded-3xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-600 shadow-xl">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          </div>
          <p class="text-xs font-medium text-slate-400">Select a thesis paper from the left panel to begin reading</p>
        </div>
      </div>
    </section>

    <!-- Right Resizer Bar -->
    <div id="resizer-right" class="resizer-h bg-slate-800/80 hover:bg-blue-500"></div>

    <!-- Column 3: Annotation Studio, Notes & Citations (Right) -->
    <aside id="studio-col" class="w-96 min-w-[300px] max-w-[600px] h-full flex-shrink-0 flex flex-col transition-all duration-200">
      <div id="annotation-studio-container" class="h-full"></div>
    </aside>

  </main>

  <!-- ================= MODALS ================= -->
  <div id="matrix-modal-container" class="hidden"></div>
  <div id="search-modal-container" class="hidden"></div>

  <!-- Toast Notifications Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <!-- Main Application Script (ES Module) -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
